# Preferred Gamerules 2.0.1 - the DEFAULT value of each rule named here, read when the game
# registers its rules. A world created after this file exists starts with these values; a world
# that already exists keeps whatever its level.dat says, because saved values win over defaults.
# Format: gamerule.<id>=<value>, ids as `/gamerule` spells them in this game version.
#
# Owner, 2026-09-26: "include the preferred gamerules mod with these two rules". Coordinates are
# hidden everywhere in the hardcore line, and both of these leak position: the F3 screen's
# coordinates and the locator bar that points at other players.
gamerule.reduced_debug_info=true
gamerule.locator_bar=false
